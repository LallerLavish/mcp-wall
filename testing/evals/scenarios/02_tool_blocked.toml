name = "consent gate: blocked tool is never invoked"
server = ["./testing/mcp_evil/target/debug/mcp_evil"]
policy = "testing/evals/policies/block_notes.toml"

[[call]]
tool = "read_project_notes"

[expect]
tools_blocked = ["read_project_notes"]
response_contains = ["blocked by policy"]
response_not_contains = ["public project notes"]